/* ================= STATE ================= */
let invites = [];
let selectedInvite = null;
let scanned = JSON.parse(localStorage.getItem("scannedList") || "[]");
let qr = null;
window.currentDisplayedInviteName = null;

/* ================= UTILS ================= */
const normalize = s =>
  (s || "")
    .toString()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ")
    .trim();

function getInviteKey(nom, table) {
  return `${normalize(nom)}__${Number(table) || 0}`;
}

function areProbablySameInvite(a, b) {
  const na = normalize(a);
  const nb = normalize(b);

  if (na === nb) return true;

  const naNoCouple = na.replace(/^couple\s+/, "");
  const nbNoCouple = nb.replace(/^couple\s+/, "");

  return naNoCouple === nbNoCouple;
}

function buildInvitesWithChanges() {
  const finalList = INVITES.map(inv => ({ ...inv }));

  CHANGEMENTS_TABLES.forEach(ch => {
    const idx = finalList.findIndex(inv => areProbablySameInvite(inv.nom, ch.nom));
    if (idx >= 0) {
      finalList[idx] = {
        nom: finalList[idx].nom,
        personnes: Number(ch.personnes) || finalList[idx].personnes,
        table: Number(ch.table) || finalList[idx].table
      };
    } else {
      finalList.push({
        nom: ch.nom,
        personnes: Number(ch.personnes) || 0,
        table: Number(ch.table) || 0
      });
    }
  });

  return finalList;
}

function findInviteByName(nom) {
  return invites.find(inv => areProbablySameInvite(inv.nom, nom));
}

function resolveInviteData(nom, personnes, table) {
  const found = findInviteByName(nom);

  if (found) {
    return {
      nom: found.nom,
      personnes: Number(found.personnes) || 0,
      table: Number(found.table) || 0
    };
  }

  return {
    nom: nom,
    personnes: Number(personnes) || 0,
    table: Number(table) || 0
  };
}

/* ================= INIT ================= */
invites = buildInvitesWithChanges();
renderScannedList();
updateCounter();
renderChangements();
startCamera();

/* ================= CAMERA ================= */
function startCamera() {
  qr = new Html5Qrcode("reader");

  qr.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    text => {
      try {
        const d = JSON.parse(text);
        processEntry(d.nom, d.personnes, d.table, "QR");
      } catch (e) {
        showStatus("QR invalide", "invalid");
      }
    },
    errorMessage => {}
  ).catch(err => {
    console.error(err);
    showStatus("Autorise la caméra puis recharge la page", "invalid");
  });
}

/* ================= CHANGEMENTS ================= */
function renderChangements() {
  const box = document.getElementById("changesList");
  if (!box) return;

  if (!CHANGEMENTS_TABLES.length) {
    box.innerHTML = "<em>Aucun changement enregistré</em>";
    return;
  }

  box.innerHTML = CHANGEMENTS_TABLES.map(c => `
    <div class="change-item">
      <strong>${c.nom}</strong><br>
      ${c.personnes} pers – Table ${c.table}
    </div>
  `).join("");
}

/* ================= NOTES ================= */
function getAccueilNote(nom) {
  return NOTES_ACCUEIL.find(n => normalize(n.nom) === normalize(nom));
}

function showAccueilNote(nom) {
  const noteBox = document.getElementById("noteBox");
  const noteDisplay = document.getElementById("noteDisplay");
  const noteEditor = document.getElementById("noteEditor");
  const editBtn = document.getElementById("editNoteBtn");
  const saveBtn = document.getElementById("saveNoteBtn");

  const match = getAccueilNote(nom);

  if (match) {
    noteDisplay.innerHTML = `<strong>${match.nom}</strong> : ${match.note}`;
    noteEditor.value = match.note;
  } else {
    noteDisplay.innerHTML = `<strong>${nom}</strong> : aucune note`;
    noteEditor.value = "";
  }

  noteEditor.style.display = "none";
  noteDisplay.style.display = "block";
  noteBox.style.display = "block";
  editBtn.style.display = "inline-block";
  saveBtn.style.display = "none";
}

function editCurrentNote() {
  if (!window.currentDisplayedInviteName) {
    showStatus("Aucun invité sélectionné", "invalid");
    return;
  }

  const code = prompt("Code admin ?");
  if (code !== ADMIN_CODE) {
    showStatus("Code admin incorrect", "invalid");
    return;
  }

  const noteDisplay = document.getElementById("noteDisplay");
  const noteEditor = document.getElementById("noteEditor");
  const saveBtn = document.getElementById("saveNoteBtn");

  noteDisplay.style.display = "none";
  noteEditor.style.display = "block";
  saveBtn.style.display = "inline-block";
}

function saveCurrentNote() {
  const nom = window.currentDisplayedInviteName;
  if (!nom) {
    showStatus("Aucun invité sélectionné", "invalid");
    return;
  }

  const code = prompt("Code admin ?");
  if (code !== ADMIN_CODE) {
    showStatus("Code admin incorrect", "invalid");
    return;
  }

  const noteEditor = document.getElementById("noteEditor");
  const nouvelleNote = noteEditor.value.trim();
  const existingIndex = NOTES_ACCUEIL.findIndex(n => normalize(n.nom) === normalize(nom));

  if (nouvelleNote) {
    if (existingIndex >= 0) {
      NOTES_ACCUEIL[existingIndex].note = nouvelleNote;
    } else {
      NOTES_ACCUEIL.push({ nom, note: nouvelleNote });
    }
  } else {
    if (existingIndex >= 0) {
      NOTES_ACCUEIL.splice(existingIndex, 1);
    }
  }

  localStorage.setItem("notesAccueil", JSON.stringify(NOTES_ACCUEIL));
  showAccueilNote(nom);
  showStatus("Note sauvegardée", "ok");
}

function clearAccueilNoteBox() {
  document.getElementById("noteBox").style.display = "none";
  document.getElementById("noteDisplay").innerHTML = "";
  document.getElementById("noteEditor").value = "";
  document.getElementById("noteEditor").style.display = "none";
  document.getElementById("editNoteBtn").style.display = "none";
  document.getElementById("saveNoteBtn").style.display = "none";
  window.currentDisplayedInviteName = null;
}

/* ================= RECHERCHE MANUELLE ================= */
function searchInvite() {
  const q = normalize(document.getElementById("manualInput").value);
  const resultsDiv = document.getElementById("results");
  resultsDiv.innerHTML = "";
  selectedInvite = null;
  document.getElementById("info").innerHTML = "";

  if (!q) {
    clearAccueilNoteBox();
    return;
  }

  const matches = invites.filter(i => normalize(i.nom).includes(q));

  if (!matches.length) {
    resultsDiv.innerHTML = "<em>Aucun invité trouvé</em>";
    clearAccueilNoteBox();
    return;
  }

  matches.slice(0, 80).forEach(inv => {
    const div = document.createElement("div");
    div.className = "result";
    div.innerHTML = `
      <strong>${inv.nom}</strong><br>
      ${inv.personnes} pers – Table ${inv.table}
    `;
    div.onclick = () => {
      selectedInvite = inv;
      window.currentDisplayedInviteName = inv.nom;

      showStatus("Invité sélectionné ✅", "ok");
      document.getElementById("info").innerHTML = `
        <p><strong>Nom :</strong> ${inv.nom}</p>
        <p><strong>Personnes :</strong> ${inv.personnes}</p>
        <p><strong>Table :</strong> ${inv.table}</p>
      `;
      showAccueilNote(inv.nom);
    };
    resultsDiv.appendChild(div);
  });
}

/* ================= VALIDATION MANUELLE ================= */
function validateManual() {
  if (!selectedInvite) {
    showStatus("Sélectionne un invité", "invalid");
    return;
  }

  processEntry(selectedInvite.nom, selectedInvite.personnes, selectedInvite.table, "manuel");

  document.getElementById("manualInput").value = "";
  document.getElementById("results").innerHTML = "";
  selectedInvite = null;
}

/* ================= LOGIQUE CENTRALE ================= */
function processEntry(nom, personnes, table, source) {
  const resolved = resolveInviteData(nom, personnes, table);
  const key = getInviteKey(resolved.nom, resolved.table);

  if (scanned.find(s => getInviteKey(s.nom, s.table) === key)) {
    showStatus("Déjà entré", "already");
    return;
  }

  scanned.push(resolved);
  localStorage.setItem("scannedList", JSON.stringify(scanned));

  showStatus(`Entrée validée (${source})`, "ok");
  renderScannedList();
  updateCounter();

  document.getElementById("info").innerHTML = `
    <p><strong>Nom :</strong> ${resolved.nom}</p>
    <p><strong>Personnes :</strong> ${resolved.personnes}</p>
    <p><strong>Table :</strong> ${resolved.table}</p>
  `;

  window.currentDisplayedInviteName = resolved.nom;
  showAccueilNote(resolved.nom);
}

/* ================= UI ================= */
function showStatus(msg, cls) {
  const s = document.getElementById("status");
  s.textContent = msg;
  s.className = "status " + cls;
}

function renderScannedList() {
  const ul = document.getElementById("scannedList");
  ul.innerHTML = "";

  scanned.forEach(i => {
    const li = document.createElement("li");
    li.textContent = `✅ ${i.nom} – ${i.personnes} pers – Table ${i.table}`;
    ul.appendChild(li);
  });
}

function updateCounter() {
  const total = scanned.reduce((s, i) => s + (Number(i.personnes) || 0), 0);
  document.getElementById("counter").textContent = `👥 Personnes entrées : ${total}`;
}

function resetAll() {
  if (prompt("Code admin ?") === ADMIN_CODE) {
    localStorage.removeItem("scannedList");
    scanned = [];
    renderScannedList();
    updateCounter();
    document.getElementById("info").innerHTML = "";
    document.getElementById("results").innerHTML = "";
    document.getElementById("manualInput").value = "";
    clearAccueilNoteBox();
    showStatus("Liste réinitialisée", "ok");
  }
}

window.onerror = function(message, source, lineno) {
  showStatus("Erreur ligne " + lineno + " : " + message, "invalid");
};
</script>
