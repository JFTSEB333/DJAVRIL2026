/* ================= UTILS ================= */
const normalize = s =>
  s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();

/* ================= QR ================= */
let qr = null;
let scanning = false;

function startScanner() {
  if (scanning) return;

  qr = new Html5Qrcode("reader");
  qr.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    onQrScan
  );
  scanning = true;
}

function stopScanner() {
  if (!qr || !scanning) return;

  qr.stop().then(() => {
    scanning = false;
    document.getElementById("reader").innerHTML = "";
  });
}

function onQrScan(text) {
  try {
    const data = JSON.parse(text);
    processEntry(data.nom, data.personnes, data.table, "QR");
    stopScanner();
  } catch {
    showStatus("QR invalide", "invalid");
  }
}

/* ================= MANUEL ================= */
function manualCheck() {
  stopScanner();

  const input = document.getElementById("manualName");
  const search = normalize(input.value);

  if (!search) {
    showStatus("Entre un nom", "invalid");
    return;
  }

  const invite = invitesAutorises.find(i =>
    normalize(i.nom).includes(search)
  );

  if (!invite) {
    showStatus("Invité non trouvé", "invalid");
    return;
  }

  processEntry(invite.nom, invite.personnes, invite.table, "manuel");
  input.value = "";
}

    return;
  }

  localStorage.setItem("scannedList", JSON.stringify(scanned));
