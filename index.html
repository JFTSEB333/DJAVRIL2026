<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrée Mariage Dorcas & Jefté</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f0f4f8;
  text-align: center;
  padding: 20px;
}
.scanner { width: 300px; margin: auto; }
.status { font-size: 1.3em; margin-top: 15px; }
.ok { color: green; }
.invalid, .already { color: red; }

.scanned-list {
  max-height: 220px;
  overflow-y: auto;
  margin-top: 25px;
  background: white;
  padding: 10px;
  border-radius: 8px;
}
input, button {
  padding: 10px;
  font-size: 1em;
  margin: 5px;
}
hr { margin: 25px 0; }
</style>
</head>

<body>

<h1>💍 Entrée Mariage Dorcas & Jefté</h1>
<h3 id="counter">👥 Personnes entrées : 0</h3>

<!-- CAMERA AUTO -->
<div id="reader" class="scanner"></div>

<div id="status" class="status"></div>
<div id="info"></div>

<hr>

<!-- MODE MANUEL -->
<h3>Recherche manuelle (secours)</h3>
<input id="manualName" placeholder="Nom de l'invité">
<br>
<button onclick="manualCheck()">Valider</button>
<button onclick="resetAll()">🔒 Reset</button>

<div class="scanned-list">
  <h3>Invités entrés</h3>
  <ul id="scannedList"></ul>
</div>

<script>
/* ================= CONFIG ================= */
const ADMIN_CODE = "ADMIN2026";
let invitesAutorises = [];

/* ================= UTILS ================= */
const normalize = s =>
  s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();

let scanned = JSON.parse(localStorage.getItem("scannedList") || "[]");

/* ================= LOAD BASE CSV ================= */
async function loadInvites() {
  try {
    const res = await fetch("invites.csv");
    const text = await res.text();
    const lines = text.trim().split("\n").slice(1);

    invitesAutorises = lines.map(l => {
      const [nom, personnes, table] = l.split(",");
      return {
        nom: nom.trim(),
        personnes: Number(personnes),
        table: Number(table)
      };
    });

    scanned.forEach(addToList);
    updateCounter();
  } catch (e) {
    showStatus("❌ Base invités introuvable", "invalid");
  }
}

loadInvites();

/* ================= CAMERA AUTO ================= */
const qr = new Html5Qrcode("reader");

window.addEventListener("load", () => {
  qr.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    onQrScan
  ).catch(() => {
    showStatus("Autorise la caméra", "invalid");
  });
});

/* ================= QR ================= */
function onQrScan(text) {
  try {
    const data = JSON.parse(text);
    processEntry(data.nom, data.personnes, data.table, "QR");
  } catch {
    showStatus("QR invalide", "invalid");
  }
}

/* ================= MANUEL ================= */
function manualCheck() {
  const input = document.getElementById("manualName");
  const search = normalize(input.value);

  if (!search) {
    showStatus("Entre un nom", "invalid");
    return;
  }

  const invite = invitesAutorises.find(i =>
    normalize(i.nom).includes(search)
  );

  if (!invite) {
    showStatus("Invité non trouvé", "invalid");
    return;
  }

  processEntry(invite.nom, invite.personnes, invite.table, "manuel");
  input.value = "";
}

/* ================= LOGIQUE CENTRALE ================= */
function processEntry(nom, personnes, table, source) {
  const nameNorm = normalize(nom);

  if (scanned.find(s => normalize(s.nom) === nameNorm)) {
    showStatus("Déjà scanné", "already");
    return;
  }

  const valid = invitesAutorises.find(i =>
    normalize(i.nom) === nameNorm &&
    i.personnes === personnes &&
    i.table === table
  );

  if (!valid) {
    showStatus("Invitation non reconnue", "invalid");
    return;
  }

  const data = { nom, personnes, table };
  scanned.push(data);
  localStorage.setItem("scannedList", JSON.stringify(scanned));

  showStatus(`Invitation valide (${source})`, "ok");

  document.getElementById("info").innerHTML = `
    <p><strong>Nom :</strong> ${nom}</p>
    <p><strong>Personnes :</strong> ${personnes}</p>
    <p><strong>Table :</strong> ${table}</p>
  `;

  navigator.vibrate?.(200);
  addToList(data);
  updateCounter();
}

/* ================= UI ================= */
function showStatus(msg, cls) {
  const s = document.getElementById("status");
  s.innerText = msg;
  s.className = "status " + cls;
}

function addToList(invite) {
  const li = document.createElement("li");
  li.textContent = `✅ ${invite.nom} – ${invite.personnes} pers – Table ${invite.table}`;
  document.getElementById("scannedList").appendChild(li);
}

function updateCounter() {
  const total = scanned.reduce((s, i) => s + i.personnes, 0);
  document.getElementById("counter").innerText =
    `👥 Personnes entrées : ${total}`;
}

function resetAll() {
  const code = prompt("Code admin ?");
  if (code === ADMIN_CODE) {
    localStorage.clear();
    location.reload();
  }
}
</script>

</body>
</html>
