<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrée Mariage Dorcas & Jefté</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f0f4f8;
  text-align: center;
  padding: 20px;
}
.scanner { width: 320px; margin: auto; }
.status { font-size: 1.2em; margin: 10px 0; }
.ok { color: green; }
.invalid, .already { color: red; }

.results, .scanned-list {
  background: #fff;
  border-radius: 8px;
  padding: 10px;
  margin-top: 15px;
  max-height: 220px;
  overflow-y: auto;
}

.result {
  padding: 8px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}
.result:hover {
  background: #e8f0fe;
}

input, button {
  padding: 10px;
  font-size: 1em;
  margin: 5px;
}
hr { margin: 25px 0; }
</style>
</head>

<body>

<h1>💍 Entrée Mariage Dorcas & Jefté</h1>
<h3 id="counter">👥 Personnes entrées : 0</h3>

<div id="reader" class="scanner"></div>

<div id="status" class="status"></div>
<div id="info"></div>

<hr>

<h3>🔍 Recherche manuelle (secours)</h3>
<input id="manualInput" placeholder="Tape le nom…" oninput="searchInvite()">

<div id="results" class="results"></div>

<button onclick="validateManual()">✅ Valider l’entrée</button>
<button onclick="resetAll()">🔒 Reset</button>

<div class="scanned-list">
  <h3>Invités entrés</h3>
  <ul id="scannedList"></ul>
</div>

<script>
/* ================= CONFIG ================= */
const ADMIN_CODE = "ADMIN2026";
let invites = [];
let selectedInvite = null;
let scanned = JSON.parse(localStorage.getItem("scannedList") || "[]");

/* ================= UTILS ================= */
const normalize = s =>
  s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();

/* ================= LOAD CSV ================= */
async function loadInvites() {
  const res = await fetch("invites.csv");
  const text = await res.text();
  const lines = text.trim().split("\n").slice(1);

  invites = lines.map(l => {
    const [nom, personnes, table] = l.split(",");
    return { nom, personnes: +personnes, table: +table };
  });

  scanned.forEach(addToList);
  updateCounter();
}
loadInvites();

/* ================= CAMERA ================= */
const qr = new Html5Qrcode("reader");
qr.start(
  { facingMode: "environment" },
  { fps: 10, qrbox: 250 },
  text => {
    try {
      const d = JSON.parse(text);
      processEntry(d.nom, d.personnes, d.table, "QR");
    } catch {
      showStatus("QR invalide", "invalid");
    }
  }
);

/* ================= RECHERCHE MANUELLE ================= */
function searchInvite() {
  const q = normalize(document.getElementById("manualInput").value);
  const resultsDiv = document.getElementById("results");
  resultsDiv.innerHTML = "";
  selectedInvite = null;
  document.getElementById("info").innerHTML = "";

  if (!q) return;

  const matches = invites.filter(i =>
    normalize(i.nom).includes(q)
  );

  if (!matches.length) {
    resultsDiv.innerHTML = "<em>Aucun invité trouvé</em>";
    return;
  }

  matches.forEach(inv => {
    const div = document.createElement("div");
    div.className = "result";
    div.innerHTML = `
      <strong>${inv.nom}</strong><br>
      ${inv.personnes} pers – Table ${inv.table}
    `;
    div.onclick = () => {
      selectedInvite = inv;
      showStatus("Invité sélectionné ✅", "ok");
      document.getElementById("info").innerHTML = `
        <p><strong>Nom :</strong> ${inv.nom}</p>
        <p><strong>Personnes :</strong> ${inv.personnes}</p>
        <p><strong>Table :</strong> ${inv.table}</p>
      `;
    };
    resultsDiv.appendChild(div);
  });
}

/* ================= VALIDATION MANUELLE ================= */
function validateManual() {
  if (!selectedInvite) {
    showStatus("Sélectionne un invité", "invalid");
    return;
  }

  processEntry(
    selectedInvite.nom,
    selectedInvite.personnes,
    selectedInvite.table,
    "manuel"
  );

  document.getElementById("manualInput").value = "";
  document.getElementById("results").innerHTML = "";
  selectedInvite = null;
}

/* ================= LOGIQUE CENTRALE ================= */
function processEntry(nom, personnes, table, source) {
  if (scanned.find(s => normalize(s.nom) === normalize(nom))) {
    showStatus("Déjà entré", "already");
    return;
  }

  scanned.push({ nom, personnes, table });
  localStorage.setItem("scannedList", JSON.stringify(scanned));

  showStatus(`Entrée validée (${source})`, "ok");
  addToList({ nom, personnes, table });
  updateCounter();
}

/* ================= UI ================= */
function showStatus(msg, cls) {
  const s = document.getElementById("status");
  s.textContent = msg;
  s.className = "status " + cls;
}

function addToList(i) {
  const li = document.createElement("li");
  li.textContent = `✅ ${i.nom} – ${i.personnes} pers – Table ${i.table}`;
  document.getElementById("scannedList").appendChild(li);
}

function updateCounter() {
  const total = scanned.reduce((s, i) => s + i.personnes, 0);
  document.getElementById("counter").textContent =
    `👥 Personnes entrées : ${total}`;
}

function resetAll() {
  if (prompt("Code admin ?") === ADMIN_CODE) {
    localStorage.clear();
    location.reload();
  }
}
</script>

</body>
</html>
