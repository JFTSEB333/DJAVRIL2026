<style>
body {
  font-family: Arial, sans-serif;
  background: #f0f4f8;
  text-align: center;
  padding: 20px;
}
.scanner {
  width: 320px;
  margin: auto;
}
.status {
  font-size: 1.2em;
  margin: 10px 0;
}
.ok { color: green; }
.invalid, .already { color: red; }

.results, .scanned-list {
  background: #fff;
  border-radius: 8px;
  padding: 10px;
  margin-top: 15px;
  max-height: 220px;
  overflow-y: auto;
}

.result {
  padding: 8px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}
.result:hover {
  background: #e8f0fe;
}

input, button, textarea {
  padding: 10px;
  font-size: 1em;
  margin: 5px;
}
hr {
  margin: 25px 0;
}

#noteBox {
  background: #fff3cd;
  color: #856404;
  border: 1px solid #ffeeba;
  border-radius: 8px;
  padding: 12px;
  margin: 15px auto;
  max-width: 500px;
  display: none;
  text-align: left;
  box-sizing: border-box;
}

#noteEditor {
  width: 100%;
  min-height: 90px;
  display: none;
  padding: 10px;
  box-sizing: border-box;
  border-radius: 6px;
  border: 1px solid #ccc;
  resize: vertical;
}

#changesBox {
  background: #fff3cd;
  color: #856404;
  border: 1px solid #ffeeba;
  border-radius: 8px;
  padding: 12px;
  margin: 15px auto;
  max-width: 500px;
  text-align: left;
  box-sizing: border-box;
  display: block;
}

#changesList {
  line-height: 1.6;
}

.change-item {
  padding: 6px 0;
  border-bottom: 1px solid #f1d98b;
}

.change-item:last-child {
  border-bottom: none;
}
</style>
</head>

<h3 id="counter">👥 Personnes entrées : 0</h3>

<div id="reader" class="scanner"></div>

<div id="status" class="status"></div>
<div id="info"></div>

<div id="changesBox">
  <div style="font-weight:bold; margin-bottom:8px;">🔄 Changements</div>
  <div id="changesList"></div>
</div>

<div id="noteBox">
  <div style="font-weight:bold; margin-bottom:8px;">⚠️ Note accueil</div>
  <div id="noteDisplay" style="margin-bottom:10px;"></div>
  <textarea id="noteEditor"></textarea>
  <div style="margin-top:10px;">
    <button id="editNoteBtn" onclick="editCurrentNote()" style="display:none;">✏️ Éditer</button>
    <button id="saveNoteBtn" onclick="saveCurrentNote()" style="display:none;">💾 Sauvegarder</button>

<hr>

<h3>🔍 Recherche manuelle (secours)</h3>
<input id="manualInput" placeholder="Tape le nom…" oninput="searchInvite()">

<div id="results" class="results"></div>

<button onclick="validateManual()">✅ Valider l’entrée</button>
<button onclick="resetAll()">🔒 Reset</button>

<div class="scanned-list">

/* ================= NOTES / CHANGEMENTS ================= */
const DEFAULT_NOTES_ACCUEIL = [
  { nom: "Couple Paulo", note: "Installer table 40" },
  { nom: "Rebecca", note: "Bien vérifier la bonne table avant installation" }
];

let NOTES_ACCUEIL = JSON.parse(
  localStorage.getItem("notesAccueil") || JSON.stringify(DEFAULT_NOTES_ACCUEIL)
);

/* ================= STATE ================= */
let invites = INVITES;
let selectedInvite = null;
let scanned = JSON.parse(localStorage.getItem("scannedList") || "[]");
let qr = null;
window.currentDisplayedInviteName = null;

/* ================= UTILS ================= */
const normalize = s =>
  (s || "")
    .toString()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ")
    .trim();

const getInviteKey = (nom, table) => `${normalize(nom)}__${Number(table) || 0}`;

/* ================= INIT ================= */
renderScannedList();
updateCounter();
renderChangements();
startCamera();

/* ================= CAMERA ================= */
function startCamera() {
  qr = new Html5Qrcode("reader");

  qr.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    text => {
      try {
        const d = JSON.parse(text);
        processEntry(d.nom, d.personnes, d.table, "QR");
      } catch (e) {
        showStatus("QR invalide", "invalid");
      }
    },
    errorMessage => {}
  ).catch(err => {
    console.error(err);
    showStatus("Autorise la caméra puis recharge la page", "invalid");
  });
}

/* ================= CHANGEMENTS ================= */
function renderChangements() {
  const box = document.getElementById("changesList");
  if (!box) return;

  if (!CHANGEMENTS_TABLES.length) {
    box.innerHTML = "<em>Aucun changement enregistré</em>";
    return;
  }

  box.innerHTML = CHANGEMENTS_TABLES.map(c => `
    <div class="change-item">
      <strong>${c.nom}</strong><br>
      ${c.personnes} pers – Table ${c.table}
    </div>
  `).join("");
}

/* ================= NOTES ================= */
function getAccueilNote(nom) {
  return NOTES_ACCUEIL.find(n => normalize(n.nom) === normalize(nom));
}

function showAccueilNote(nom) {
  const noteBox = document.getElementById("noteBox");
  const noteDisplay = document.getElementById("noteDisplay");
  const noteEditor = document.getElementById("noteEditor");
  const editBtn = document.getElementById("editNoteBtn");
  const saveBtn = document.getElementById("saveNoteBtn");

  const match = getAccueilNote(nom);

  if (match) {
    noteDisplay.innerHTML = `<strong>${match.nom}</strong> : ${match.note}`;
    noteEditor.value = match.note;
  } else {
    noteDisplay.innerHTML = `<strong>${nom}</strong> : aucune note`;
    noteEditor.value = "";
  }

  noteEditor.style.display = "none";
  noteDisplay.style.display = "block";
  noteBox.style.display = "block";
  editBtn.style.display = "inline-block";
  saveBtn.style.display = "none";
}

function editCurrentNote() {
  if (!window.currentDisplayedInviteName) {
    showStatus("Aucun invité sélectionné", "invalid");
    return;
  }

  const code = prompt("Code admin ?");
  if (code !== ADMIN_CODE) {
    showStatus("Code admin incorrect", "invalid");
    return;
  }

  const noteDisplay = document.getElementById("noteDisplay");
  const noteEditor = document.getElementById("noteEditor");
  const saveBtn = document.getElementById("saveNoteBtn");

  noteDisplay.style.display = "none";
  noteEditor.style.display = "block";
  saveBtn.style.display = "inline-block";
}

function saveCurrentNote() {
  const nom = window.currentDisplayedInviteName;
  if (!nom) {
    showStatus("Aucun invité sélectionné", "invalid");
    return;
  }

  const code = prompt("Code admin ?");
  if (code !== ADMIN_CODE) {
    showStatus("Code admin incorrect", "invalid");
    return;
  }

  const noteEditor = document.getElementById("noteEditor");
  const nouvelleNote = noteEditor.value.trim();
  const existingIndex = NOTES_ACCUEIL.findIndex(n => normalize(n.nom) === normalize(nom));

  if (nouvelleNote) {
    if (existingIndex >= 0) {
      NOTES_ACCUEIL[existingIndex].note = nouvelleNote;
    } else {
      NOTES_ACCUEIL.push({ nom, note: nouvelleNote });
    }
  } else {
    if (existingIndex >= 0) {
      NOTES_ACCUEIL.splice(existingIndex, 1);
    }
  }

  localStorage.setItem("notesAccueil", JSON.stringify(NOTES_ACCUEIL));
  showAccueilNote(nom);
  showStatus("Note sauvegardée", "ok");
}

function clearAccueilNoteBox() {
  document.getElementById("noteBox").style.display = "none";
  document.getElementById("noteDisplay").innerHTML = "";
  document.getElementById("noteEditor").value = "";
  document.getElementById("noteEditor").style.display = "none";
  document.getElementById("editNoteBtn").style.display = "none";
  document.getElementById("saveNoteBtn").style.display = "none";
  window.currentDisplayedInviteName = null;
}

/* ================= RECHERCHE MANUELLE ================= */
function searchInvite() {
  const q = normalize(document.getElementById("manualInput").value);
  const resultsDiv = document.getElementById("results");
  resultsDiv.innerHTML = "";
  selectedInvite = null;
  document.getElementById("info").innerHTML = "";

  if (!q) {
    clearAccueilNoteBox();
    return;
  }

  const matches = invites.filter(i => normalize(i.nom).includes(q));

  if (!matches.length) {
    resultsDiv.innerHTML = "<em>Aucun invité trouvé</em>";
    clearAccueilNoteBox();
    return;
  }

  matches.slice(0, 80).forEach(inv => {
    const div = document.createElement("div");
    div.className = "result";
    div.innerHTML = `
      <strong>${inv.nom}</strong><br>
      ${inv.personnes} pers – Table ${inv.table}
    `;
    div.onclick = () => {
      selectedInvite = inv;
      window.currentDisplayedInviteName = inv.nom;

      showStatus("Invité sélectionné ✅", "ok");
      document.getElementById("info").innerHTML = `
        <p><strong>Nom :</strong> ${inv.nom}</p>
        <p><strong>Personnes :</strong> ${inv.personnes}</p>
        <p><strong>Table :</strong> ${inv.table}</p>
      `;
      showAccueilNote(inv.nom);
    };
    resultsDiv.appendChild(div);
  });
}

/* ================= VALIDATION MANUELLE ================= */
function validateManual() {
  if (!selectedInvite) {
    showStatus("Sélectionne un invité", "invalid");
    return;
  }

  processEntry(selectedInvite.nom, selectedInvite.personnes, selectedInvite.table, "manuel");

  document.getElementById("manualInput").value = "";
  document.getElementById("results").innerHTML = "";
  selectedInvite = null;
}

/* ================= LOGIQUE CENTRALE ================= */
function processEntry(nom, personnes, table, source) {
  const key = getInviteKey(nom, table);

  if (scanned.find(s => getInviteKey(s.nom, s.table) === key)) {
    showStatus("Déjà entré", "already");
    return;
  }

  const entry = {
    nom,
    personnes: Number(personnes) || 0,
    table: Number(table) || 0
  };

  scanned.push(entry);
  localStorage.setItem("scannedList", JSON.stringify(scanned));

  showStatus(`Entrée validée (${source})`, "ok");
  renderScannedList();
  updateCounter();

  document.getElementById("info").innerHTML = `
    <p><strong>Nom :</strong> ${entry.nom}</p>
    <p><strong>Personnes :</strong> ${entry.personnes}</p>
    <p><strong>Table :</strong> ${entry.table}</p>
  `;

  window.currentDisplayedInviteName = entry.nom;
  showAccueilNote(entry.nom);
}

/* ================= UI ================= */
function showStatus(msg, cls) {
  const s = document.getElementById("status");
  s.textContent = msg;
  s.className = "status " + cls;
}

function renderScannedList() {
  const ul = document.getElementById("scannedList");
  ul.innerHTML = "";

  scanned.forEach(i => {
    const li = document.createElement("li");
    li.textContent = `✅ ${i.nom} – ${i.personnes} pers – Table ${i.table}`;
    ul.appendChild(li);
  });
}

function updateCounter() {
  const total = scanned.reduce((s, i) => s + (Number(i.personnes) || 0), 0);
  document.getElementById("counter").textContent = `👥 Personnes entrées : ${total}`;
}

function resetAll() {
  if (prompt("Code admin ?") === ADMIN_CODE) {
    localStorage.removeItem("scannedList");
    scanned = [];
    renderScannedList();
    updateCounter();
    document.getElementById("info").innerHTML = "";
    document.getElementById("results").innerHTML = "";
    document.getElementById("manualInput").value = "";
    clearAccueilNoteBox();
    showStatus("Liste réinitialisée", "ok");
  }
}

window.onerror = function(message, source, lineno) {
  showStatus("Erreur ligne " + lineno + " : " + message, "invalid");
};
</script>
