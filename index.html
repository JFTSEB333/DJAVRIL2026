.result:hover { background: #e8f0fe; }

  padding: 10px;
  font-size: 1em;
  margin: 5px;

/* ================= STATE ================= */
let invites = INVITES;
let selectedInvite = null;
let scanned = JSON.parse(localStorage.getItem("scannedList") || "[]");

/* ================= UTILS ================= */
const normalize = s =>
  (s || "")
    .toString()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ")
    .trim();

/* ================= INIT ================= */
scanned.forEach(addToList);
updateCounter();

/* ================= CAMERA ================= */
const qr = new Html5Qrcode("reader");
qr.start(
  { facingMode: "environment" },
  { fps: 10, qrbox: 250 },
  text => {
    try {
      const d = JSON.parse(text);
      processEntry(d.nom, d.personnes, d.table, "QR");
    } catch {
      showStatus("QR invalide", "invalid");
    }
  },
  err => {}
).catch(() => {
  showStatus("Autorise la caméra puis recharge la page", "invalid");
});

/* ================= RECHERCHE MANUELLE ================= */
function searchInvite() {
  const q = normalize(document.getElementById("manualInput").value);
  const resultsDiv = document.getElementById("results");
  resultsDiv.innerHTML = "";
  selectedInvite = null;
  document.getElementById("info").innerHTML = "";

  if (!q) return;

  const matches = invites.filter(i => normalize(i.nom).includes(q));

  if (!matches.length) {
    resultsDiv.innerHTML = "<em>Aucun invité trouvé</em>";
    return;
  }

  matches.slice(0, 80).forEach(inv => {
    const div = document.createElement("div");
    div.className = "result";
    div.innerHTML = `
      <strong>${inv.nom}</strong><br>
      ${inv.personnes} pers – Table ${inv.table}
    `;
    div.onclick = () => {
      selectedInvite = inv;
      showStatus("Invité sélectionné ✅", "ok");
      document.getElementById("info").innerHTML = `
        <p><strong>Nom :</strong> ${inv.nom}</p>
        <p><strong>Personnes :</strong> ${inv.personnes}</p>
        <p><strong>Table :</strong> ${inv.table}</p>
      `;
    };
    resultsDiv.appendChild(div);
  });
}

/* ================= VALIDATION MANUELLE ================= */
function validateManual() {
  if (!selectedInvite) {
    showStatus("Sélectionne un invité", "invalid");
    return;
  }

  processEntry(selectedInvite.nom, selectedInvite.personnes, selectedInvite.table, "manuel");

  document.getElementById("manualInput").value = "";
  document.getElementById("results").innerHTML = "";
  document.getElementById("info").innerHTML = "";
  selectedInvite = null;
}

/* ================= LOGIQUE CENTRALE ================= */
function processEntry(nom, personnes, table, source) {
  if (scanned.find(s => normalize(s.nom) === normalize(nom))) {
    showStatus("Déjà entré", "already");
    return;
  }

  scanned.push({ nom, personnes, table });
  localStorage.setItem("scannedList", JSON.stringify(scanned));

  showStatus(`Entrée validée (${source})`, "ok");
  addToList({ nom, personnes, table });
  updateCounter();
}

/* ================= UI ================= */
function showStatus(msg, cls) {
  const s = document.getElementById("status");
  s.textContent = msg;
  s.className = "status " + cls;
}

function addToList(i) {
  const li = document.createElement("li");
  li.textContent = `✅ ${i.nom} – ${i.personnes} pers – Table ${i.table}`;
  document.getElementById("scannedList").appendChild(li);
}

function updateCounter() {
  const total = scanned.reduce((s, i) => s + (Number(i.personnes) || 0), 0);
  document.getElementById("counter").textContent = `👥 Personnes entrées : ${total}`;
}

function resetAll() {
  if (prompt("Code admin ?") === ADMIN_CODE) {
    localStorage.clear();
    location.reload();
  }
}
